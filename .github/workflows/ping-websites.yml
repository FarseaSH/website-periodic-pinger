name: 定期访问网站

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  ping-websites:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: 设置环境
      run: |
        echo "开始执行网站访问任务..."
        echo "当前时间: $(date)"
    
    - name: 执行网站请求
      env:
        # 从 GitHub Secrets 获取网站列表
        WEBSITES: ${{ secrets.WEBSITES }}
        USER_AGENT: ${{ secrets.USER_AGENT }}
        TIMEOUT: ${{ secrets.TIMEOUT }}
      run: |
        # 检查是否设置了必要的 secrets
        if [ -z "$WEBSITES" ]; then
          echo "❌ 错误: 请在仓库设置中配置 WEBSITES secret"
          exit 1
        fi
        
        # 设置默认值
        TIMEOUT=${TIMEOUT:-30}
        USER_AGENT=${USER_AGENT:-"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"}
        
        echo "🔍 调试信息:"
        echo "   WEBSITES 变量长度: ${#WEBSITES}"
        echo "   超时设置: ${TIMEOUT}秒"
        echo "   User-Agent: ${USER_AGENT}"
        echo "   网站数量: $(echo "$WEBSITES" | tr ',' '\n' | wc -l)"
        echo ""
        
        echo "🚀 开始访问网站..."
        
        # 计数器
        success_count=0
        total_count=0
        
        # 将网站列表分割并逐个访问
        IFS=',' read -ra WEBSITE_ARRAY <<< "$WEBSITES"
        for website in "${WEBSITE_ARRAY[@]}"; do
          # 去除空格
          website=$(echo "$website" | xargs)
          
          if [ -n "$website" ]; then
            total_count=$((total_count + 1))
            echo "📡 正在访问网站 #${total_count}..."
            echo "   🔗 URL长度: ${#website} 字符"
            
            # 使用 curl 请求网站，添加详细调试
            if curl -v -s -o /dev/null -w "%{http_code}|%{time_total}|%{size_download}" \
                   --max-time "$TIMEOUT" \
                   --user-agent "$USER_AGENT" \
                   --location \
                   --insecure \
                   --compressed \
                   --header "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
                   --header "Accept-Language: en-US,en;q=0.5" \
                   --header "Accept-Encoding: gzip, deflate" \
                   --header "DNT: 1" \
                   --header "Connection: keep-alive" \
                   --header "Upgrade-Insecure-Requests: 1" \
                   "$website" > /tmp/curl_output_${total_count} 2> /tmp/curl_error_${total_count}; then
              
              # 解析输出
              output=$(cat /tmp/curl_output_${total_count})
              IFS='|' read -r http_code time_total size_download <<< "$output"
              
              if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 400 ]; then
                echo "   ✅ 访问成功! HTTP: $http_code, 耗时: ${time_total}s, 大小: ${size_download}B"
                success_count=$((success_count + 1))
              else
                echo "   ⚠️  异常状态码: $http_code, 耗时: ${time_total}s"
                echo "   📄 错误详情:"
                head -5 /tmp/curl_error_${total_count} | sed 's/^/      /'
              fi
            else
              echo "   ❌ 访问失败!"
              echo "   📄 错误详情:"
              head -5 /tmp/curl_error_${total_count} | sed 's/^/      /'
              echo "   🔍 连接信息:"
              grep -E "(Could not resolve|Connection refused|timeout|SSL|certificate)" /tmp/curl_error_${total_count} | head -3 | sed 's/^/      /'
            fi
            
            echo ""
            # 请求间隔，避免过于频繁
            sleep 3
          fi
        done
        
        echo ""
        echo "📊 执行结果统计:"
        echo "   总计: $total_count 个网站"
        echo "   成功: $success_count 个"
        echo "   失败: $((total_count - success_count)) 个"
        echo "   成功率: $(( success_count * 100 / total_count ))%"
        
        # 如果所有网站都失败了，标记为失败
        if [ $success_count -eq 0 ] && [ $total_count -gt 0 ]; then
          echo "💥 所有网站访问都失败了！"
          exit 1
        fi
    
    - name: 完成
      run: |
        echo "🎉 任务执行完成！"
        echo "下次执行时间: $(date -d '+1 hour')"